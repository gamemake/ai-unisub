services:
  ai-unisub:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UNISUB_HOST_PORT:-8080}:${UNISUB_PORT:-8080}"
    environment:
      UNISUB_PORT: "${UNISUB_PORT:-8080}"
      UNISUB_DB_PATH: /app/data/unisub.db
      UNISUB_MASTER_KEY: "${UNISUB_MASTER_KEY:?set UNISUB_MASTER_KEY}"
      UNISUB_CREDENTIAL_KEY_ID: "${UNISUB_CREDENTIAL_KEY_ID:-local-v1}"
      UNISUB_ADMIN_USERNAME: "${UNISUB_ADMIN_USERNAME:-admin}"
      UNISUB_ADMIN_PASSWORD: "${UNISUB_ADMIN_PASSWORD:-admin}"
      UNISUB_ADMIN_TOKEN_TTL: "${UNISUB_ADMIN_TOKEN_TTL:-8h}"
      UNISUB_MAX_BODY_BYTES: "${UNISUB_MAX_BODY_BYTES:-268435456}"
      UNISUB_SHUTDOWN_TIMEOUT: "${UNISUB_SHUTDOWN_TIMEOUT:-15s}"
    volumes:
      - unisub-data:/app/data
volumes:
  unisub-data:
