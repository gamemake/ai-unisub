services:
  ai-unisub:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UNISUB_HOST_PORT:-8080}:${UNISUB_PORT:-8080}"
    environment:
      UNISUB_PORT: "${UNISUB_PORT:-8080}"
      UNISUB_DB_PATH: /app/data/unisub.db
      UNISUB_ADMIN_USERNAME: "${UNISUB_ADMIN_USERNAME:-admin}"
      UNISUB_ADMIN_PASSWORD: "${UNISUB_ADMIN_PASSWORD:-admin}"
      UNISUB_ADMIN_TOKEN_TTL: "${UNISUB_ADMIN_TOKEN_TTL:-8h}"
      UNISUB_MAX_BODY_BYTES: "${UNISUB_MAX_BODY_BYTES:-268435456}"
      UNISUB_CONCURRENCY_QUEUE_TIMEOUT_SECONDS: "${UNISUB_CONCURRENCY_QUEUE_TIMEOUT_SECONDS:-180}"
      UNISUB_REQUEST_LOG_RETENTION_DAYS: "${UNISUB_REQUEST_LOG_RETENTION_DAYS:-30}"
      UNISUB_GROK_OAUTH_ISSUER: "${UNISUB_GROK_OAUTH_ISSUER:-https://auth.x.ai}"
      UNISUB_GROK_OAUTH_CLIENT_ID: "${UNISUB_GROK_OAUTH_CLIENT_ID:-b1a00492-073a-47ea-816f-4c329264a828}"
      UNISUB_GROK_CLIENT_VERSION: "${UNISUB_GROK_CLIENT_VERSION:-1.0.6}"
      UNISUB_GROK_OAUTH_SCOPES: "${UNISUB_GROK_OAUTH_SCOPES:-openid profile email offline_access grok-cli:access api:access conversations:read conversations:write workspaces:read workspaces:write}"
      UNISUB_GROK_BILLING_URL: "${UNISUB_GROK_BILLING_URL:-https://cli-chat-proxy.grok.com/v1/billing?format=credits}"
      UNISUB_SHUTDOWN_TIMEOUT: "${UNISUB_SHUTDOWN_TIMEOUT:-15s}"
    volumes:
      - unisub-data:/app/data
volumes:
  unisub-data:
